name: Flutter CI

# LOAD-BEARING: o ruleset SoloForte depende de on.pull_request para main.
# Não remover — sem ele o check analyze-and-test não corre no PR.
# Ver docs/03_ENFORCEMENT/supervisor-merge-gate.md
on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
