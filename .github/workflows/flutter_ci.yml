name: Flutter CI

# LOAD-BEARING: o ruleset SoloForte depende de on.pull_request para main.
# Não remover — sem ele o check analyze-and-test não corre no PR.
# Ver docs/03_ENFORCEMENT/supervisor-merge-gate.md
on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

# Versão fixa, não `channel: stable` flutuante: em Set/2026 o stable saltou de
# 3.41.6 para 3.47.5 e a main ficou vermelha sem ninguém tocar em código.
# Bump é decisão explícita — subir aqui junto com o Flutter da máquina de build.
# Ver .github/workflows/architecture.yml (mesmo pin).
env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
